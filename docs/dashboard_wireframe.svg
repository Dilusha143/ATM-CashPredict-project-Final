    <rect x="464" y="270" width="290" height="90" rx="12" fill="#111218" stroke="#242530"/>
    <rect x="766" y="270" width="290" height="90" rx="12" fill="#111218" stroke="#242530"/>
    <rect x="1068" y="270" width="332" height="90" rx="12" fill="#111218" stroke="#242530"/>
    <text x="486" y="304" fill="#5B5C6B" font-size="10">TOTAL PREDICTED</text>
    <text x="486" y="336" fill="#F2F2F7" font-size="20" font-weight="700">LKR 2.4M</text>
    <text x="788" y="304" fill="#5B5C6B" font-size="10">AVG CONFIDENCE</text>
    <text x="788" y="336" fill="#F2F2F7" font-size="20" font-weight="700">87%</text>
    <text x="1090" y="304" fill="#5B5C6B" font-size="10">ATMS FLAGGED</text>
    <text x="1090" y="336" fill="#F2F2F7" font-size="20" font-weight="700">1 / 5</text>
