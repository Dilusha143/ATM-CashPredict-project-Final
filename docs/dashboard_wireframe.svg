  <text x="86" y="52" fill="#5B5C6B" font-size="11" letter-spacing="1">DEMAND FORECASTING SYSTEM</text>

  <rect x="1010" y="22" width="90" height="28" rx="14" fill="#1A1B24" stroke="#2A2B36"/>
