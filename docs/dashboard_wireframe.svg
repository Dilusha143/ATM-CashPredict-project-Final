    <text x="740" y="238">🚨 Cash Alerts</text>
    <text x="838" y="238">🌕 Poya Days</text>
    <text x="930" y="238">🎄 Special Days</text>
    <text x="1030" y="238">🌸 Sinhala NY</text>
    <text x="1120" y="238">📈 History</text>
    <text x="1200" y="238">🤖 Model Stats</text>
    <text x="1300" y="238">📅 Missing Dates</text>
  </g>

