version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: atm-backend
    working_dir: /app
    environment:
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: "5000"
      FLASK_DEBUG: "0"
      PYTHONUNBUFFERED: "1"
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    command: python branch_backend/app.py

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: atm-frontend
    depends_on:
      - backend
    environment:
      VITE_API_TARGET: http://backend:5000
    ports:
      - "5173:5173"
    volumes:
      - ./branch_frontend/react_app:/app
    command: npm run dev -- --host 0.0.0.0 --port 5173
